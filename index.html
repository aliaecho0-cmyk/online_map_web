    <title>百团大战 · 活动导览</title>
    <script>
      // 微信 WebView 会把整个旧版本（index.html 和 JS 包）缓存在自己那儿，且不一定遵守
      // Cache-Control，导致更新后手机仍显示旧页面。构建时会注入 window.__BUILD__，
      // 这里跟线上的 version.json 比对，发现不是同一版就带 ?v= 参数强制重新拉取。
      (function () {
        var build = window.__BUILD__;
        if (!build || !window.fetch) return;
        fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (v) {
            if (!v || !v.build || v.build === build) return;
            try {
              // 同一版只强制刷一次：万一 CDN 仍在发旧 html，也只会多刷一次而不是死循环
              var key = 'build-reloaded-' + v.build;
              if (sessionStorage.getItem(key)) return;
              sessionStorage.setItem(key, '1');
            } catch (e) {}
            location.replace(
              location.href.split('#')[0].split('?')[0] + '?v=' + v.build + location.hash
            );
          })
          .catch(function () {});
      })();
    </script>
